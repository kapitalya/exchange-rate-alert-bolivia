<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Kapitalya Exchange Monitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Inter',sans-serif; background:#f3f4f6; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-card { background:#fff; border-radius:16px; padding:40px; max-width:380px; width:100%; box-shadow:0 4px 24px rgba(0,0,0,0.08); }
    .brand { text-align:center; margin-bottom:28px; }
    .brand h1 { font-size:1.5rem; font-weight:700; color:#111928; }
    .brand p { color:#6b7280; font-size:.875rem; margin-top:4px; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand">
    <h1>📈 Kapitalya</h1>
    <p>Exchange Rate Monitor</p>
  </div>
  {% if form.errors %}
  <div class="alert alert-danger" style="font-size:.875rem;">Credenciales incorrectas. Intente nuevamente.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-500" style="font-size:.875rem;">Usuario</label>
      <input type="text" name="username" class="form-control" autofocus required>
    </div>
    <div class="mb-4">
      <label class="form-label fw-500" style="font-size:.875rem;">Contraseña</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
  </form>
</div>
</body>
</html>
